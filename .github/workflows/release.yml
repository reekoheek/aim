name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          archive="aim-server_${VERSION}_${GOOS}_${GOARCH}"
          if [ "${GOOS}" = windows ]; then
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/aim-server.exe ./cmd/aim-server
            (cd dist && zip -q "${archive}.zip" aim-server.exe && rm aim-server.exe)
          else
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/aim-server ./cmd/aim-server
            tar -C dist -czf "dist/${archive}.tar.gz" aim-server
            rm dist/aim-server
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: aim-server_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/aim-server_*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum aim-server_* > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --generate-notes \
            dist/aim-server_* dist/SHA256SUMS.txt
