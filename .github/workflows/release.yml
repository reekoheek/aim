name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: ppc64le
            goppc64: power9
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOPPC64: ${{ matrix.goppc64 }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          archive="aim_${VERSION}_${GOOS}_${GOARCH}"
          if [ "${GOOS}" = windows ]; then
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/aim.exe ./cmd/aim
            (cd dist && zip -q "${archive}.zip" aim.exe && rm aim.exe)
          else
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/aim ./cmd/aim
            tar -C dist -czf "dist/${archive}.tar.gz" aim
            rm dist/aim
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: aim_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/aim_*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum aim_* > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --generate-notes \
            dist/aim_* dist/SHA256SUMS.txt
